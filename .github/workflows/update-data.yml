name: Update data and publish

on:
  schedule:
    # Weekdays at 13:30 UTC (9:30 am Eastern). FRED posts the previous day's oil and
    # gas prices in the morning; the monthly PPI lands mid-month and is picked up the same day.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "series.json"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pvc-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Pull latest prices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch series from FRED
        run: node scripts/fetch-data.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          # manifest.json carries a run timestamp that changes every time, so only
          # commit when a series file actually changed. The deploy job below still
          # publishes the fresh manifest from the working tree either way.
          if git diff --cached --quiet -- . ':!docs/data/manifest.json'; then
            echo "No new observations; nothing to commit."
          else
            git commit -m "data: refresh series $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish to GitHub Pages
    needs: update
    # Pages only serves one branch's build, so publish from the default branch alone.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable Pages if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
